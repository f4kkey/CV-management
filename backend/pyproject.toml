[project]
name = "thesis-backend"
version = "0.1.0"
description = "CV management API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1,<2",
    "minio>=7,<8",
    "PyMuPDF>=1.24,<2",
    "rapidocr==3.9.2",
    "onnxruntime>=1.20,<2",
    "pillow>=10,<14",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = [
    "sys_platform == 'win32' or sys_platform == 'linux'",
]

